name: Standards

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: standards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (moon ci)
    runs-on: ubuntu-latest
    steps:
      # Full history so moon can work out which projects a PR affects.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      # Installs proto, then node, pnpm and moon at the versions pinned in .prototools.
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - run: pnpm install --frozen-lockfile

      # Lint (oxlint + anti-slop), format (oxfmt), typecheck, tests and build of affected projects.
      - run: moon ci

      # Files outside moon projects (root configs, workflows, docs).
      - run: pnpm format:check

  review:
    name: Review (Claude · Hallmark + anti-slop)
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Skip without an API key
        if: env.HAS_ANTHROPIC_KEY != 'true'
        run: echo "::notice::Add the ANTHROPIC_API_KEY secret to enable the standards review."

      - uses: actions/checkout@v4
        if: env.HAS_ANTHROPIC_KEY == 'true'
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        if: env.HAS_ANTHROPIC_KEY == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request against pienance's standards. The PR branch is checked out.
            Read CLAUDE.md first; it lists the standards. Lint, format, types and tests already run in
            the "Checks" job, so do not repeat them — review what tools cannot judge:

            1. Architecture: domain-driven design with the ubiquitous language in README.md, SOLID,
               KISS and YAGNI. @pienance/core stays pure TypeScript (no Node, DOM or frameworks) so a
               native app can reuse it; business logic never lives in apps/.
            2. Code quality: the intent behind the anti-slop rules in tools/oxlint/anti-slop
               (parse input at boundaries, no type laundering, readable code). Money only through
               the core's Money/Currency (Dinero.js), never plain-number arithmetic.
            3. Design: if the PR touches UI (apps/web/src or packages/ui), run a Hallmark audit as
               described in .claude/skills/hallmark/SKILL.md (`hallmark audit`) and
               .claude/skills/hallmark/references/verbs/audit.md, against the system stamped in
               packages/ui/src/styles/globals.css. Mobile first, shadcn components from
               @pienance/ui, locked tokens, no slop-test failures.

            Use inline comments for specific lines. Finish with one `gh pr comment` summary: a short
            verdict and a checklist of the three areas. Only report real problems; say so when there
            are none.
          claude_args: |
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
